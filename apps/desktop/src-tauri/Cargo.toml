[package]
name = "desktop"
version = "0.1.0"
description = "Life Context desktop shell"
authors = ["Life Context"]
edition = "2021"
rust-version = "1.77.2"
build = "build.rs"

[lib]
name = "desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon"] }
